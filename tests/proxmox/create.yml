---
# Create throwaway test VMs on Proxmox from cloud-init templates.
#   ansible-playbook tests/proxmox/create.yml -e '{"proxmox_machines": ["workstation-test-debian"]}'
# Normally driven by tests/run_proxmox_tests.py.
- name: Create Proxmox test VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    proxmox_machines: []
  tasks:
    - name: Connect to Proxmox
      ansible.builtin.include_tasks: tasks/connect.yml

    - name: Select machines
      ansible.builtin.set_fact:
        proxmox_selected: "{{ proxmox_machine_table | selectattr('name', 'in', proxmox_machines) | list }}"

    - name: Require a known machine selection
      ansible.builtin.assert:
        that: proxmox_selected | length == proxmox_machines | length and proxmox_machines | length > 0
        fail_msg: "Unknown or empty machine list {{ proxmox_machines }} (see tests/vm/machines.yml)"
        quiet: true

    - name: List existing VMs
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/cluster/resources?type=vm"
        headers:
          Authorization: "{{ proxmox_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: proxmox_vms

    - name: Require templates for the selected OSes
      ansible.builtin.assert:
        that: >-
          proxmox_vms.json.data | selectattr('vmid', 'equalto', proxmox_templates[item].vmid | int)
          | selectattr('template', 'defined') | selectattr('template', 'equalto', 1) | list | length == 1
        fail_msg: >-
          Template {{ proxmox_templates[item].vmid }} for '{{ item }}' is missing.
          Build it once with: tests/run_proxmox_tests.py --templates
        quiet: true
      loop: "{{ proxmox_selected | map(attribute='os') | unique | list }}"

    - name: Refuse to reuse a VMID that is not a leftover test VM
      ansible.builtin.assert:
        that: >-
          proxmox_vms.json.data | selectattr('vmid', 'equalto', item.vmid)
          | rejectattr('tags', 'defined') | list | length == 0 and
          proxmox_vms.json.data | selectattr('vmid', 'equalto', item.vmid) | selectattr('tags', 'defined')
          | rejectattr('tags', 'search', 'workstation-test') | list | length == 0
        fail_msg: "VMID {{ item.vmid }} is in use by a VM not tagged workstation-test; change proxmox_test_vmid_base."
        quiet: true
      loop: "{{ proxmox_selected }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Remove leftover test VMs from a previous run
      ansible.builtin.include_tasks: tasks/destroy_vm.yml
      loop: "{{ proxmox_selected | selectattr('vmid', 'in', proxmox_vms.json.data | map(attribute='vmid') | list) | list }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }} ({{ vm.vmid }})"

    - name: Read SSH public key for the test user
      ansible.builtin.set_fact:
        proxmox_ssh_pubkey: "{{ lookup('file', proxmox_test_ssh_pubkey_file | expanduser) | trim }}"

    - name: Create, configure and start test VMs
      ansible.builtin.include_tasks: tasks/create_vm.yml
      loop: "{{ proxmox_selected }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }} ({{ vm.vmid }}, {{ vm.ip }})"

    # Ubuntu 26.04 images bring the NIC up with DHCP in the dracut initramfs
    # before cloud-init runs, so the static IP only applies from the second boot
    # (cloud-init logs "Error renaming ... from ens18 to eth0"). Reboot VMs that
    # don't answer on their static IP; harmless for images that work first time.
    - name: Wait for SSH on the static IPs
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 180
      loop: "{{ proxmox_selected }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ip }})"
      register: proxmox_first_boot
      ignore_errors: true   # keeps failed=true per item for the reboot step

    - name: Reboot VMs whose static IP did not come up
      ansible.builtin.include_tasks: tasks/api.yml
      vars:
        api_method: POST
        api_path: "/nodes/{{ proxmox_node }}/qemu/{{ item.item.vmid }}/status/reboot"
      loop: "{{ proxmox_first_boot.results | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Ensure state directory exists
      ansible.builtin.file:
        path: "{{ proxmox_state_dir | expanduser }}"
        state: directory
        mode: "0755"

    - name: Write inventory of the test VMs
      ansible.builtin.copy:
        dest: "{{ proxmox_state_dir | expanduser }}/inventory.yml"
        mode: "0644"
        content: |
          # Generated by tests/proxmox/create.yml — Proxmox test VMs
          all:
            children:
              proxmox_tests:
                hosts:
          {% for vm in proxmox_selected %}
                  {{ vm.hostname }}:
                    ansible_host: {{ vm.ip }}
                    profile: {{ vm.profile }}
                    proxmox_vmid: {{ vm.vmid }}
          {% endfor %}
                vars:
                  ansible_user: {{ proxmox_test_user }}
                  ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    - name: Add test VMs to this run
      ansible.builtin.add_host:
        name: "{{ item.hostname }}"
        groups: proxmox_tests
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ proxmox_test_user }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        proxmox_gui: "{{ item.gui | default(false) | bool }}"
      loop: "{{ proxmox_selected }}"
      loop_control:
        label: "{{ item.hostname }}"

- name: Wait for test VMs to finish booting
  hosts: proxmox_tests
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # rc 2 = finished with recoverable warnings, which is fine for tests.
    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    # First-boot apt timers race the playbook for the dpkg lock.
    - name: Stop background apt jobs
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service
      become: true
      failed_when: false

# Desktop-profile machines must have a display device, like a real desktop.
# The VM has a std VGA adapter; the guest also needs a DRM driver for it
# (bochs). Debian's generic image ships it; Ubuntu cloud kernels keep it in
# linux-modules-extra-<kernel>, which this installs (udev autoloads it on later
# boots). Fails if there is still no /sys/class/drm/card*.
- name: Provide a display device on desktop test VMs
  hosts: proxmox_tests
  gather_facts: false
  tasks:
    - name: Desktop VMs only
      ansible.builtin.meta: end_host
      when: not proxmox_gui | bool

    - name: Look for a DRM display device
      ansible.builtin.find:
        paths: /sys/class/drm
        patterns: "card[0-9]*"
        file_type: any
      register: drm_before

    - name: Install the display driver and load it
      when: drm_before.matched == 0
      block:
        - name: Gather minimal facts
          ansible.builtin.setup:
            gather_subset: [min]

        - name: Install linux-modules-extra for the running kernel (Ubuntu)
          ansible.builtin.apt:
            name: "linux-modules-extra-{{ ansible_facts['kernel'] }}"
            state: present
            update_cache: true
          become: true
          when: ansible_facts['distribution'] == 'Ubuntu'

        - name: Load the QEMU std-VGA DRM driver
          ansible.builtin.shell: modprobe bochs || modprobe bochs-drm
          become: true
          changed_when: true

    - name: Confirm the display device
      ansible.builtin.find:
        paths: /sys/class/drm
        patterns: "card[0-9]*"
        file_type: any
      register: drm_after
      failed_when: drm_after.matched == 0
