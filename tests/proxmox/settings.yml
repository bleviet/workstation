---
# Proxmox VE test-VM settings (tests/run_proxmox_tests.py).
# Throwaway VMs are linked clones of cloud-init templates, provisioned with
# ansible/site.yml twice (idempotency check) and destroyed afterwards — no
# local disk is used.
#
# These are public defaults. Your host and network go in a private override
# file (same keys, loaded on top of this one):
#   $PROXMOX_SETTINGS, else ~/.config/workstation-proxmox/settings.yml
# The keys left empty below are required there.
#
# Credentials are never stored here. Export an API token before running:
#   export PROXMOX_TOKEN_ID='ansible@pve!workstation-tests'
#   export PROXMOX_TOKEN_SECRET='xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'

proxmox_api_host: ""             # required, e.g. 192.168.1.46
proxmox_api_port: 8006
proxmox_validate_certs: false    # default PVE install uses a self-signed cert
# Leave empty to auto-detect (works for single-node installs).
proxmox_node: ""

proxmox_storage: local-lvm       # must support linked clones (LVM-thin, ZFS, Ceph, qcow2 dir)
proxmox_bridge: vmbr0

# Cloud-init templates, one per OS key used in tests/vm/machines.yml.
# Built once by: tests/run_proxmox_tests.py --templates   (SSH as root to the PVE host)
proxmox_templates:
  debian13:
    vmid: 9000
    # "generic", not "genericcloud": the cloud kernel has no DRM/display
    # drivers, so desktop-profile tests could never start a display manager.
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
  ubuntu2404:
    vmid: 9001
    url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  ubuntu2604:
    vmid: 9002
    url: https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img

# Test VMs get vmid = base + index and ip = prefix.(start + index), where index
# is the machine's position in tests/vm/machines.yml. Keep the IP range outside
# the router's DHCP pool (FRITZ!Box default: .20-.200).
proxmox_test_vmid_base: 9100
proxmox_test_ip_prefix: ""       # required, first three octets, e.g. 192.168.1
proxmox_test_ip_start: 230
proxmox_test_ip_cidr: 24
proxmox_test_gateway: ""         # required, e.g. 192.168.1.1
proxmox_test_nameserver: ""      # required, e.g. 192.168.1.1

proxmox_test_disk_gb: 16         # headless machines
proxmox_test_disk_gb_gui: 32     # desktop profiles

# Cloud-init login used by Ansible (gets passwordless sudo from cloud-init).
proxmox_test_user: tester
proxmox_test_ssh_pubkey_file: ~/.ssh/id_ed25519.pub

# Generated inventory of the running test VMs.
proxmox_state_dir: ~/.cache/workstation-proxmox
