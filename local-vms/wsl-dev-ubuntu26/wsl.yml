# WSL2 Instance — General-purpose Ubuntu 26.04 development environment
# Run scripts/new_wsl_instance.ps1 -SpecFile local-vms/wsl-dev-ubuntu26/wsl.yml
# to create this instance on Windows.

name: wsl-dev-ubuntu26
os: ubuntu2604           # must match a key in os_wsl_map in new_wsl_instance.ps1
install_location: "D:/WSL/wsl-dev-ubuntu26"   # where the VHDX is stored on the host
