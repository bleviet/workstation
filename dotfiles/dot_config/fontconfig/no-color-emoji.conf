<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  System font config minus color (bitmap) fonts such as Noto Color Emoji.
  Used only by the gitk wrapper in ~/.config/shell/aliases.sh via FONTCONFIG_FILE:
  Tk renders through libXft, and libXft < 2.3.5 (e.g. Ubuntu 22.04) crashes with
  "BadLength ... RENDER / RenderAddGlyphs" when a commit message or diff falls back
  to a color emoji glyph (seen in gitk over Xpra while browsing with j/k).
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="color"><bool>true</bool></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
