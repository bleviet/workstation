---
all:
  children:
    workstations:
      hosts:
        localhost:
          ansible_connection: local
      # Add remote workstations here, e.g.:
      # my_laptop:
      #   ansible_host: 192.168.1.10
      #   ansible_user: balevision
    servers:
      hosts:
        # Add remote servers here, e.g.:
        workstation-test-debian-i3wm:
          ansible_host: 192.168.246.139
          ansible_user: vagrant
        # workstation-test-ubuntu-i3wm:
        #   ansible_host: 192.168.246.146
        #   ansible_user: vagrant
        workstation-test-almalinux-i3wm:
          ansible_host: 192.168.246.143
          ansible_user: vagrant
    fpga_vms:
      hosts:
        vm-fpga-dev-alma-9:
        vm-fpga-dev-alma-10:
        vm-fpga-dev-debian-13:
        vm-fpga-dev-ubuntu-2404:
          ansible_host: 192.168.246.146
          ansible_user: bleviet
          ansible_connection: ssh
        vm-fpga-dev-ubuntu-2604:
      vars:
        ansible_connection: local

    # ── WSL2 named instances ───────────────────────────────────────────────────
    # Each host name must match the WSL2 distribution name (wsl --list).
    # Provisioned from Windows via: ansible-playbook ansible/site.yml -l wsl_instances
    # Or a single instance:         ansible-playbook ansible/site.yml -l wsl-fpga-dev
    # Run from an elevated PowerShell or from the controller container.
    wsl_instances:
      hosts:
        # Add WSL2 instances here after creating them with scripts/new_wsl_instance.ps1
        # wsl-dev-ubuntu26:
        # wsl-fpga-dev:
      vars:
        ansible_connection: community.general.wsl
        ansible_wsl_distribution: "{{ inventory_hostname }}"
