---
features:
  fpga: false

# ── Vivado runtime dependencies (Ubuntu 24.04 / Debian) ──────────────────────
# Covers Vivado 2025.2.  Both amd64 and i386 variants where available.
# Note: libpng12 is NOT in Ubuntu 24.04 repos; Vivado 2025.2 bundles it internally.
fpga_vivado_libs_apt:
  - libx11-6
  - libx11-6:i386
  - libxrender1
  - libxrender1:i386
  - libxtst6
  - libxtst6:i386
  - libxi6
  - libxi6:i386
  - libxcursor1
  - libxcursor1:i386
  - libxrandr2
  - libxrandr2:i386
  - libxft2
  - libxft2:i386
  - libxext6
  - libxext6:i386
  - libxfixes3
  - libxfixes3:i386
  - libfreetype6
  - libfreetype6:i386
  - libfontconfig1
  - libfontconfig1:i386
  - libglib2.0-0t64         # amd64 only — Ubuntu 24.04 t64 variant
  - libglib2.0-0:i386       # i386 keeps the pre-t64 name on Noble
  - libgtk-3-0t64           # GTK3 — new hard dep in Vivado 2025.x (replaces GTK2)
  - libsm6
  - libsm6:i386
  - libice6
  - libice6:i386
  - libc6:i386
  - libstdc++6
  - libstdc++6:i386
  - libgcc-s1
  - libgcc-s1:i386
  - zlib1g
  - zlib1g:i386
  - libssl3t64
  - libcrypt1               # libxcrypt compat — provides libcrypt.so.1 for internal Vivado tools
  - libncurses6
  - libncurses6:i386
  - libtinfo6
  - libtinfo6:i386
  - libgomp1
  - libgomp1:i386
  - cpio                    # Vivado 2025.x installer and post-processing scripts
  - x11-utils               # Provides xlsclients — checked by Vivado at startup

# ── Quartus Prime runtime dependencies (Ubuntu 24.04 / Debian) ───────────────
fpga_quartus_libs_apt:
  - libpng16-16t64
  - libqt5widgets5t64
  - libqt5core5t64
  - libqt5gui5t64
  - libqt5xml5t64
  - libqt5network5t64
  - libqt5printsupport5t64
  - libqt5svg5
  - libexpat1
  - libexpat1:i386

# ── USB / JTAG libraries ──────────────────────────────────────────────────────
fpga_usb_libs_apt:
  - libusb-1.0-0
  - libusb-1.0-0-dev
  - libusb-0.1-4
  - usbutils
  - fxload

# ── Simulation / waveform tools (Vivado/Quartus-agnostic) ────────────────────
fpga_oss_tools_apt:
  - iverilog    # Verilog/SystemVerilog simulator
  - gtkwave     # waveform viewer for VCD/FST files
  - verilator   # fast Verilog simulator and linter
  - ghdl        # VHDL simulator (supports VHDL-2008)
  # nvc is not in Ubuntu apt repos — installed separately via nvc_debian.yml

# ── Quartus Prime Lite unattended installation ───────────────────────────────
# Vendor downloads are supplied locally because accepting the Altera EULA is a
# user action and the download URLs are not suitable for unattended automation.
fpga_quartus_install_enabled: false
fpga_quartus_accept_eula: false
fpga_quartus_version: "25.1std"
fpga_quartus_source_dir: /opt/fpga-installers/quartus-lite/25.1std
fpga_quartus_install_dir: "{{ dev_user_home }}/altera_lite/{{ fpga_quartus_version }}"
fpga_quartus_installer_file: QuartusLiteSetup-25.1std.0.1129-linux.run
fpga_quartus_installer_sha1: ce0773469eacab5b7035c175484625f4ec3737d1
fpga_quartus_device_file: cyclonev-25.1std.0.1129.qdz
fpga_quartus_device_sha1: a7225ec1bd36ccfd6826ea6273df5d21dd95633b

# ── nvc (not in apt — installed from GitHub) ─────────────────────────────────
# Pre-built .deb packages per Ubuntu release; source tarball otherwise.
nvc_version: "1.21.0"
nvc_source_url: "https://github.com/nickg/nvc/releases/download/r{{ nvc_version }}/nvc-{{ nvc_version }}.tar.gz"
# Map Ubuntu distribution version to the matching .deb asset name.
nvc_debian_urls:
  "22.04": "https://github.com/nickg/nvc/releases/download/r{{ nvc_version }}/nvc_{{ nvc_version }}-1_amd64_ubuntu-22.04.deb"
  "24.04": "https://github.com/nickg/nvc/releases/download/r{{ nvc_version }}/nvc_{{ nvc_version }}-1_amd64_ubuntu-24.04.deb"

# ── Groups the dev_user is added to for JTAG / serial access ─────────────────
fpga_user_groups:
  - plugdev
  - dialout
  - video
  - tty
