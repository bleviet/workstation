---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install i3wm and supporting tools
  ansible.builtin.package:
    name: "{{ i3wm_packages }}"
    state: present
  become: true

- name: Enable LightDM
  ansible.builtin.service:
    name: lightdm
    enabled: true
  become: true
  failed_when: false

# Starting needs a display device (detected in the desktop role). Without one
# the display manager crash-loops and every run would retry and report changed.
- name: Start LightDM
  ansible.builtin.service:
    name: lightdm
    state: started
  become: true
  when: desktop_has_display | default(true) | bool

- name: Note that LightDM was not started
  ansible.builtin.debug:
    msg: "No display device (/sys/class/drm/card*): LightDM is enabled and will start on a machine with a display."
  when: not (desktop_has_display | default(true) | bool)
