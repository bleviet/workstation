---

- name: Remove legacy VS Code apt source (conflicts with deb822 entry)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/apt/sources.list.d/vscode.list
    - /etc/apt/keyrings/microsoft.asc
  when: ansible_facts['os_family'] == "Debian"

- name: Install system packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ packages.common + packages.apt }}"
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install system packages (macOS via Homebrew)
  community.general.homebrew:
    name: "{{ (packages.common + packages.homebrew) | difference(['procps']) }}"
    state: present
    update_homebrew: true
  when: ansible_facts['os_family'] == "Darwin"

- name: Configure WSL2 environment
  ansible.builtin.include_tasks: wsl.yml
  when: ansible_facts['kernel'] | lower is search('microsoft')
