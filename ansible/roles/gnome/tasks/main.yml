---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      skip: true

- name: Install GNOME desktop environment
  ansible.builtin.package:
    name: "{{ gnome_packages }}"
    state: present
  become: true

- name: Enable GDM
  ansible.builtin.service:
    name: "{{ gnome_service }}"
    enabled: true
  become: true
  failed_when: false

# Starting needs a display device (detected in the desktop role). Without one
# the display manager crash-loops and every run would retry and report changed.
- name: Start GDM
  ansible.builtin.service:
    name: "{{ gnome_service }}"
    state: started
  become: true
  when:
    - desktop_has_display | default(true) | bool

- name: Note that GDM was not started
  ansible.builtin.debug:
    msg: "No display device (/sys/class/drm/card*): GDM is enabled and will start on a machine with a display."
  when:
    - not (desktop_has_display | default(true) | bool)

