---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      skip: true

- name: Install XFCE desktop environment
  ansible.builtin.package:
    name: "{{ xfce_packages }}"
    state: present
  become: true
  when: xfce_packages | length > 0

- name: Enable LightDM
  ansible.builtin.service:
    name: lightdm
    enabled: true
  become: true
  failed_when: false
  when: xfce_packages | length > 0

# Starting needs a display device (detected in the desktop role). Without one
# the display manager crash-loops and every run would retry and report changed.
- name: Start LightDM
  ansible.builtin.service:
    name: lightdm
    state: started
  become: true
  when:
    - xfce_packages | length > 0
    - desktop_has_display | default(true) | bool

- name: Note that LightDM was not started
  ansible.builtin.debug:
    msg: "No display device (/sys/class/drm/card*): LightDM is enabled and will start on a machine with a display."
  when:
    - xfce_packages | length > 0
    - not (desktop_has_display | default(true) | bool)

- name: Ensure /etc/lightdm/lightdm.conf.d exists
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: xfce_packages | length > 0 and (xfce_autologin_user | default("") | length > 0)

- name: Configure LightDM autologin for {{ xfce_autologin_user }}
  ansible.builtin.copy:
    content: |
      [Seat:*]
      autologin-user={{ xfce_autologin_user }}
      autologin-user-timeout=0
      user-session=xfce
    dest: /etc/lightdm/lightdm.conf.d/10-autologin.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: xfce_packages | length > 0 and (xfce_autologin_user | default("") | length > 0)
