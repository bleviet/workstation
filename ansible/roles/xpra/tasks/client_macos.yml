---
# Xpra client on macOS: Xpra.app + low-latency client config + `ssh` wrapper
# that auto-attaches to the server session when you `ssh <alias>`.

# Homebrew disabled the xpra cask on 2026-09-01 (fails the Gatekeeper check),
# so Xpra.app is installed by hand from https://xpra.org/ and only checked here.
- name: Check for Xpra.app
  ansible.builtin.stat:
    path: /Applications/Xpra.app
  register: xpra_app

- name: Require Xpra.app
  ansible.builtin.assert:
    that: xpra_app.stat.exists
    fail_msg: >-
      Xpra.app is missing. Homebrew's xpra cask is disabled; download the
      macOS build from https://xpra.org/ into /Applications, then re-run.
    quiet: true

- name: Ensure Xpra client config directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/Library/Application Support/Xpra"
    state: directory
    mode: "0755"

# blockinfile (not a full template) so hand edits elsewhere in xpra.conf survive.
# Xpra turns a key set twice into a list and the client then crashes on start
# (bool options). Comment out hand-written copies of the managed keys that sit
# above the managed block; once commented they no longer match (idempotent).
- name: Comment out xpra.conf settings that the managed block sets
  ansible.builtin.replace:
    path: "{{ dev_user_home }}/Library/Application Support/Xpra/xpra.conf"
    before: "# BEGIN ANSIBLE MANAGED BLOCK \\(xpra role\\)"
    regexp: '^(\s*(?:ssh|min-speed|audio|printing|webcam|mdns|notifications)\s*=.*)$'
    replace: '# \1   (set in the Ansible block below)'
  failed_when: false   # file may not exist yet; blockinfile creates it

- name: Tune Xpra client for low-latency LAN use
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/Library/Application Support/Xpra/xpra.conf"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (xpra role)"
    block: |
      # Native OpenSSH (Paramiko stalls / hangs on exit); no SSH compression —
      # Xpra already compresses frames.
      ssh = {{ xpra_client_ssh_command }}
      min-speed = {{ xpra_client_min_speed }}
      # Subsystems that slow attach or hang shutdown (GStreamer, CUPS polling).
      audio = no
      printing = no
      webcam = no
      mdns = no
      notifications = no

- name: Add SSH host aliases for Xpra servers
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.ssh/config"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (xpra role)"
    block: |
      {% for h in xpra_client_hosts if h.hostname is defined %}
      Host {{ h.alias }}
        HostName {{ h.hostname }}
      {% if h.port is defined %}
        Port {{ h.port }}
      {% endif %}
      {% if h.user is defined %}
        User {{ h.user }}
      {% endif %}
        ServerAliveInterval 30
      {% endfor %}
  when: xpra_client_hosts | selectattr('hostname', 'defined') | list | length > 0

- name: Ensure ~/.config/shell exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.config/shell"
    state: directory
    mode: "0755"

- name: Install ssh auto-attach wrapper
  ansible.builtin.template:
    src: xpra_ssh.sh.j2
    dest: "{{ dev_user_home }}/.config/shell/xpra_ssh.sh"
    mode: "0644"
    backup: true  # keep a hand-written wrapper recoverable on first run
  when: xpra_client_hosts | length > 0
