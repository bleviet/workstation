---
- name: Install xrdp (Debian/Ubuntu)
  ansible.builtin.apt:
    name: xrdp
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Add xrdp user to ssl-cert group (Debian/Ubuntu)
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Allow xrdp port through ufw (Debian/Ubuntu)
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
  become: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - xrdp_configure_firewall

- name: Enable and start xrdp service
  ansible.builtin.service:
    name: xrdp
    state: started
    enabled: true
  become: true
  notify: Restart xrdp
  failed_when: false
