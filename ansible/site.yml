---
# Full workstation provisioning. Run order matters:
#
# Base roles (always applied):
#   user → packages → dev-tools → shell → chezmoi → fonts → ssh → workspace
#
# Optional features (skipped unless the matching flag is set):
#   fpga   — features.fpga: true
#   xrdp   — features.xrdp: true
#   xpra   — features.xpra: true (server on Debian/Ubuntu, client on macOS)
#
# Desktop roles (applied based on the host's `profile` variable):
#   headless      — SSH only, no GUI
#   desktop-gnome — GNOME + GDM
#   desktop-xfce  — XFCE + LightDM
#   desktop-i3wm  — i3wm + LightDM
#
# Usage:
#   ansible-playbook playbooks/site.yml -K
- name: Provision workstation
  # maintenance_only: hosts managed by maintenance.yml only (e.g. a hypervisor).
  hosts: all:!maintenance_only
  gather_facts: false
  pre_tasks:
    - name: Require ansible-core >= 2.15
      ansible.builtin.assert:
        that:
          - ansible_version.major > 2 or
            (ansible_version.major == 2 and ansible_version.minor >= 15)
        fail_msg: |
          ansible-core >= 2.15 is required (found {{ ansible_version.full }}).
          The system apt package is usually too old — install via pip:

            pip3 install --user "ansible-core>=2.17"
            export PATH="$HOME/.local/bin:$PATH"   # or open a new terminal
      delegate_to: localhost
      run_once: true
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always
  roles:
    # ── Base ───────────────────────────────────────────────────────────────
    - user
    - packages
    - dev-tools
    - shell
    - chezmoi
    - fonts
    - ssh
    # NAS share at ~/synology via systemd automount (off unless enabled)
    - role: nas-mount
      tags: [nas-mount]
    # ~/workspace layout + clone missing repos (list in the inventory)
    - workspace
    # ── Optional features ─────────────────────────────────────────────────
    - role: fpga
      when: >-
        (features.fpga.vivado  | default(false) | bool or
         features.fpga.quartus | default(false) | bool or
         features.fpga.oss     | default(false) | bool) and
        ansible_facts['os_family'] != "Darwin"
    - role: desktop
      when: "'desktop' in profile and ansible_facts['os_family'] != 'Darwin'"
    - role: gnome
      when: "profile == 'desktop-gnome' and ansible_facts['os_family'] != 'Darwin'"
    - role: xfce
      when: "profile == 'desktop-xfce' and ansible_facts['os_family'] != 'Darwin'"
    - role: i3wm
      when: "profile == 'desktop-i3wm' and ansible_facts['os_family'] != 'Darwin'"
    - role: xrdp
      when: "features.xrdp | default(false) and ansible_facts['os_family'] != 'Darwin'"
    # Server on Debian/Ubuntu (after ssh — clients attach over sshd), client on macOS.
    - role: xpra
      when: features.xpra | default(false) | bool
  # ── Post-provisioning ──────────────────────────────────────────────────────
  # Runs after all roles. Neovim binary and dotfiles (including LazyVim config)
  # must both be in place before plugins can be synced.
  post_tasks:
    # `restore` installs exactly the versions in the chezmoi-managed
    # lazy-lock.json (sync would update past it and drift from the repo).
    # Reports changed only when a plugin's checked-out commit changed.
    - name: Pre-install LazyVim plugins
      ansible.builtin.shell: |
        set -e
        dir="$HOME/.local/share/nvim/lazy"
        state() {
          for d in "$dir"/*/; do
            [ -d "$d" ] && printf '%s %s\n' "$d" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo none)"
          done | cksum
        }
        before=$(state)
        "{{ dev_tools_bin_dir }}/nvim" --headless "+Lazy! restore" +qa
        after=$(state)
        [ "$before" = "$after" ] || echo "LAZYVIM_CHANGED"
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ dev_user_home }}"
      become: "{{ dev_user != ansible_facts['user_id'] }}"
      become_user: "{{ dev_user }}"
      register: lazyvim_restore
      changed_when: "'LAZYVIM_CHANGED' in lazyvim_restore.stdout"
      when: features.editor.lazyvim | default(false) | bool

    - name: Pre-install Tmux plugins
      ansible.builtin.shell: |
        tmux start-server
        tmux source-file ~/.tmux.conf || true
        ~/.tmux/plugins/tpm/bin/install_plugins
      environment:
        HOME: "{{ dev_user_home }}"
        TMUX_PLUGIN_MANAGER_PATH: "{{ dev_user_home }}/.tmux/plugins"
      become: "{{ dev_user != ansible_facts['user_id'] }}"
      become_user: "{{ dev_user }}"
      register: tmux_plugins
      # tpm prints "Installing \"<name>\"" when it clones a plugin and
      # "Already installed \"<name>\"" otherwise — only the former is a change.
      changed_when: "'Installing \"' in tmux_plugins.stdout"
      ignore_errors: true
